# NewGate 一键部署。用户不需要选数据库——PostgreSQL 与 Redis 都在这里。
#
#   1) cp .env.example .env  然后按注释填必须改的三个密钥
#   2) docker compose up -d
#   3) 管理台（含 API）http://localhost:7081  ·  用户控制台 http://localhost:7082
#      后端直连 http://localhost:7080 仅供调试：该端口不经 Caddy，X-Forwarded-For 一律不信
#
# 镜像构建上下文是父目录（Gradle composite build 需要看到同级的 neton 与各模块仓库）。

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-newgate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-newgate}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-newgate} -d ${POSTGRES_DB:-newgate}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # 默认不对外暴露数据库端口；本地调试时自行放开
    expose:
      - "5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    expose:
      - "6379"

  # 迁移与服务分开：迁移失败就不该起服务，避免在半套 schema 上接流量
  migrate:
    build:
      context: ..
      dockerfile: newgate/Dockerfile
    image: nanogate:latest
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NETON_DATABASE__DEFAULT__URI: postgresql://${POSTGRES_USER:-newgate}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-newgate}
      NETON_SECURITY__JWT__SECRETKEY: ${JWT_SECRET:?请在 .env 中设置 JWT_SECRET}
    command: ["migrate", "up"]

  newgate:
    build:
      context: ..
      dockerfile: newgate/Dockerfile
    image: nanogate:latest
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      NETON_DATABASE__DEFAULT__URI: postgresql://${POSTGRES_USER:-newgate}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-newgate}
      NETON_REDIS__HOST: redis
      NETON_REDIS__PORT: "6379"
      NETON_SECURITY__JWT__SECRETKEY: ${JWT_SECRET:?请在 .env 中设置 JWT_SECRET}
      # 未设置则渠道 Key 以明文入库——数据库一旦泄露，你采购的所有上游 Key 都会泄露
      NEWGATE_CHANNEL_KEY_ENC_KEY: ${CHANNEL_KEY_ENC_KEY:-}
      # 自托管且上游在内网时才打开（默认拒绝内网地址以防 SSRF）
      NEWGATE_ALLOW_PRIVATE_UPSTREAM: ${ALLOW_PRIVATE_UPSTREAM:-false}
      # 双轨计价：售价 = sale_override 或官方价 × 加价率（收入）；成本 = 官方价 × 渠道折扣
      NEWGATE_SALE_MARKUP: ${SALE_MARKUP:-1}
      # 发布闸门：售价低于「官方成本 × 此倍率」的定价不得保存
      NEWGATE_MIN_MARGIN: ${MIN_MARGIN:-1}
      # 前置反代时**必须**设：它决定网关认哪个地址是「客户端」，令牌 IP 白名单完全建在它上面。
      # 空 = 不信任任何转发头（X-Forwarded-For / X-Real-IP 一律忽略），直连部署留空即可。
      # 注意这与 IP 白名单的语义相反：白名单空是放开限制，代理名单空是收紧信任。
      NEWGATE_TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.28.0.10}
      # 充值汇率：每 1 单位 pay_orders.price（法币最小单位）发多少 μUSD 额度。
      # ⚠️ **不设 = 充值功能整个不可用**：每次下单都 500 "quota recharge is not configured"。
      # 这是有意的 —— 静默按 1:1 发放等于白送钱且不留痕迹，所以账务宁可拒绝也不猜汇率。
      # 这里故意留空而不填一个数：没有普适默认值（取决于你按什么币种定价），
      # 而 compose 里写死的默认值会与代码默认值漂移，迟早坑一个人。
      NEWGATE_QUOTA_PER_PRICE_UNIT: ${QUOTA_PER_PRICE_UNIT:-}
      # 按会员分组计价的开关。空/false = 所有用户按同一套组倍率计价。
      # 开着却没绑 MemberGroupPort 会**启动失败**（NanoGate 已绑，见 Main.kt）——
      # 那是故意的：绑了不生效会被当成解析器的 bug 去查。
      NEWGATE_MEMBER_GROUP_BILLING: ${MEMBER_GROUP_BILLING:-}
      # 邀请奖励（μUSD）。空或 0 = 该角色不发奖 —— 默认不发，因为发钱的路径不该因为一次
      # 升级就自己打开。非法值（1e3 / -5 / 带单位的串）不会被静默当成 0：该角色不发奖并记 ERROR。
      # 生效值在启动日志里：grep "invite reward attached"。
      NEWGATE_INVITE_REWARD_INVITER: ${INVITE_REWARD_INVITER:-}
      NEWGATE_INVITE_REWARD_INVITEE: ${INVITE_REWARD_INVITEE:-}
      # 支付回调地址（要收真钱就得设，两项都必须是**公网可访问**的绝对地址）。
      # NOTIFY_BASE = 后端对外的 origin，渠道服务器要能从它打到
      #   {NOTIFY_BASE}/app/pay/channel-notify/{渠道码}
      # RETURN_URL = 用户付完跳回的控制台账单页。
      # 两项留空都不会让支付失败，但各自退化一处：NOTIFY_BASE 空 → 渠道不主动回调，到账靠
      # pay-order-reconcile 定时查单兜底（十来分钟：十分钟一轮，刚下单 2 分钟内的会被跳过）；
      # RETURN_URL 空 → 用户付完回不到你的页面（这一项与渠道回不回调无关）。
      # 生效值在启动日志：grep "payment.callback-url"。
      # ⚠️ 没设 NOTIFY_BASE 就别在后台停用 pay-order-reconcile：两条到账路径全断 = 钱到账了额度永远不发。
      # ⚠️ 别填容器内部地址（http://localhost:7080 或 http://newgate:7080）：本地跑得通，
      # 上线后一律回调失败 —— 而失败发生在渠道那一侧，你这边只看到订单一直是待支付。
      NEWGATE_PAY_NOTIFY_BASE: ${PAY_NOTIFY_BASE:-}
      NEWGATE_PAY_RETURN_URL: ${PAY_RETURN_URL:-}
      # 有意**不**在这里暴露 NEWGATE_ENABLE_MOCK_RECHARGE：它让 mock 充值接口凭空发额度
      # （代码里标着「仅测试环境」）。不写进 compose 不是访问控制 —— 变量照样生效 ——
      # 而是不把「白送钱」放进官方支持的部署面。真要在沙箱里开，自己往 environment 里加一行。
    ports:
      - "${NEWGATE_PORT:-7080}:7080"

  # ── 管理台（Next.js）。浏览器直连后端 + cookie 认证 ⇒ 必须与后端同源，由 caddy 按路径分流 ──
  front:
    build:
      context: ..
      dockerfile: NewGate/newgate-front/Dockerfile
    image: nanogate-front:latest
    restart: unless-stopped
    depends_on:
      newgate:
        condition: service_healthy
    expose: ["3000"]

  # ── 用户控制台（Next.js）。自带 /api/backend 服务端代理，只需内网后端地址 ──
  console:
    build:
      context: ..
      dockerfile: NewGate/newgate-client/Dockerfile
    image: nanogate-console:latest
    restart: unless-stopped
    depends_on:
      newgate:
        condition: service_healthy
    environment:
      NETON_BACKEND_URL: http://newgate:7080
    expose: ["3000"]

  # ── 边缘反代：deploy/Caddyfile。固定 IP 使后端能把它列为唯一受信代理 ──
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      front:
        condition: service_healthy
      console:
        condition: service_healthy
    environment:
      ADMIN_SITE: ${ADMIN_SITE:-:7081}
      CONSOLE_SITE: ${CONSOLE_SITE:-:7082}
    ports:
      - "${ADMIN_PORT:-7081}:7081"
      - "${CONSOLE_PORT:-7082}:7082"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      default:
        ipv4_address: 172.28.0.10

# 默认网络固定网段：caddy 需要一个可被后端 NEWGATE_TRUSTED_PROXIES 引用的稳定地址
networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  redis-data:
